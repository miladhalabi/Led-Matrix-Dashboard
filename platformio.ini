[platformio]
default_envs = esp32dev

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
; https://github.com/tzapu/WiFiManager.git

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
; two 1.875 MB firmware slots for over-the-air updates (the default layout has 1.25 MB). Changing the layout needs one wired upload.
board_build.partitions = min_spiffs.csv
build_flags = -DIOTWEBCONF_PASSWORD_LEN=65
lib_deps =
    ; Pinned to the exact versions this firmware was built and checked with.
    https://github.com/MajicDesigns/MD_MAX72XX.git#b852c70
    bblanchon/ArduinoJson @ 6.21.6
    https://github.com/cotestatnt/AsyncTelegram2.git#aad5583
    https://github.com/MajicDesigns/MD_Parola.git#c3a62b8
    https://github.com/prampec/IotWebConf.git#0c18912
    arduino-libraries/NTPClient @ 3.2.1
    https://github.com/madhephaestus/ESP32Encoder.git#7501cb4
    https://github.com/adafruit/RTClib.git#5298434
    dfrobot/DFRobotDFPlayerMini @ 1.0.6
    https://github.com/plerup/espsoftwareserial.git#40038df
    ; pulled in by the libraries above; pinned so a new release cannot change the build
    adafruit/Adafruit BusIO @ 1.17.4
    dok-net/ghostl @ 1.0.1

; Unit tests of the pure logic on the PC: pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17 -Itest/support -fsanitize=address,undefined -fno-omit-frame-pointer
test_build_src = yes
build_src_filter = -<*> +<converters/> +<formaters/> +<parsers/> +<textUtils/>
