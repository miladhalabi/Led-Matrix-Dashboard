[platformio]
default_envs = esp32dev

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
; https://github.com/tzapu/WiFiManager.git

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
; two 1.875 MB firmware slots for over-the-air updates (the default layout has 1.25 MB). Changing the layout needs one wired upload.
board_build.partitions = min_spiffs.csv
build_flags = -DIOTWEBCONF_PASSWORD_LEN=65
lib_deps = 
    https://github.com/MajicDesigns/MD_MAX72XX.git
    bblanchon/ArduinoJson @ ^6.21.5
    https://github.com/cotestatnt/AsyncTelegram2.git
    https://github.com/MajicDesigns/MD_Parola.git
    https://github.com/prampec/IotWebConf.git
    NTPClient
    https://github.com/madhephaestus/ESP32Encoder.git
    https://github.com/adafruit/RTClib.git
    DFRobotDFPlayerMini
    https://github.com/plerup/espsoftwareserial.git
    ;https://github.com/PowerBroker2/DFPlayerMini_Fast.git // //

; Unit tests of the pure logic on the PC: pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17 -Itest/support -fsanitize=address,undefined -fno-omit-frame-pointer
test_build_src = yes
build_src_filter = -<*> +<converters/> +<formaters/> +<parsers/>
